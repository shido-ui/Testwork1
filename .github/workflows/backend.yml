name: Backend CI

on:
  push:
    branches: ["main", "phase/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test]" --no-deps && python -m pip install fastapi uvicorn pydantic pydantic-settings pytest httpx
        working-directory: backend
      - name: Tests
        run: pytest -q
        working-directory: backend
